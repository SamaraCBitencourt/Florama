services:
  - type: web
    name: florama-api
    runtime: python
    rootDir: trabalho/api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: florama-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: florama-site
    runtime: static
    rootDir: trabalho
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://florama-api.onrender.com
      - key: EXPO_PUBLIC_WHATSAPP_NUMBER
        value: "5591991128090"

databases:
  - name: florama-db
    databaseName: florama
    plan: free
